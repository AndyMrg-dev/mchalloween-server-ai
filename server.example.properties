# Minecraft Server Properties (Nosferatu / Halloween Event)
# https://github.com/your-username/your-repo

# Basic Settings
gamemode=survival
difficulty=easy
hardcore=false
max-players=20
motd=A Minecraft Server - Halloween Event
level-name=world
level-type=minecraft\:normal
pvp=true

# Server Ports
server-port=25565
query.port=25565

# RCON Configuration (Required for Nosferatu Bot)
enable-rcon=true
rcon.port=25575
rcon.password=YOUR_RCON_PASSWORD

# Resource Pack Settings (Halloween Texture Pack)
require-resource-pack=true
resource-pack=https\://www.dropbox.com/scl/fi/7yvy0oikfrof73fa3y8yj/Halloween-Mash-up.zip?rlkey\=c4mw9x9jl10a4q97xxgimzgqi&st\=6tygr75c&dl\=1
resource-pack-prompt=Install the halloween texture pack\!

# Security & Management
online-mode=true
enforce-secure-profile=true
management-server-enabled=false
management-server-secret=YOUR_MANAGEMENT_SECRET